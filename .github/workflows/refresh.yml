name: refresh
on:
  schedule:
    - cron: "30 3 * * *"   # daily 03:30 UTC (09:00 IST)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m sd311.pipeline refresh
      - name: Retrain ticket models (Mondays, or when run manually)
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m sd311.pipeline tickets
          fi
      - name: Commit refreshed results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/forecast.json docs/tickets.json
          git diff --cached --quiet || (git commit -m "chore: refresh $(date -u +%F)" && git push)
